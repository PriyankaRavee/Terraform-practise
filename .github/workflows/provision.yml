name: Provision EC2 with Terraform

on:
  push:
    branches:
      - dev_v1

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init
      run: terraform init
    
    - name: Terraform Import EC2 Key Pair (safe)
      run: |
        terraform state list | grep aws_key_pair.devops_key || \
        terraform import aws_key_pair.devops_key devops-key

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Apply
      run: |
        terraform apply -auto-approve \
          -var="key_name=devops-key"

    - name: Show EC2 IP
      run: terraform output ec2_public_ip